services:
  - type: web
    name: clinica-angular-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://proyecto-diplomado-angular.netlify.app
      - key: ALLOWED_ORIGINS
        value: https://proyecto-diplomado-angular.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SCHEMA
        value: public
      - key: COMPANY_ID
        value: "1"
      - key: PUBLIC_COMPANY_ID
        value: "1"

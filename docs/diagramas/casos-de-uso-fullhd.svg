" fill="#effaf7" stroke="#078778" stroke-width="2.3"/><text x="1400" y="592" text-anchor="middle" font-size="20" fill="#17334c">Consultar radiografía</text></g><g class="use-case" id="carga"><ellipse cx="1400" cy="805" rx="180" ry="52" fill="#f5efff" stroke="#8054cf" stroke-width="2.3"/><text x="1400" y="812" text-anchor="middle" font-size="20" fill="#17334c">Cargar radiografía con enlace</text></g>

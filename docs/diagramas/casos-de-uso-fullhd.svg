<style>text{font-family:Arial,Helvetica,sans-serif}.association{fill:none;stroke-width:1.7;stroke-linejoin:round;opacity:.65}.uml .association{marker-end:none}.use-case text{font-weight:600}</style>
<rect width="1920" height="1080" fill="url(#bg)"/>
<text x="960" y="70" text-anchor="middle" font-size="40" fill="#17334c">Casos de uso principales</text><text x="960" y="110" text-anchor="middle" font-size="23" fill="#64748b">Clínica Odontológica San Martín · CERPAX</text>

<rect x="375" y="930" width="1208" height="98" rx="18" fill="white" stroke="#d7e2eb"/>
<text x="979" y="968" text-anchor="middle" font-size="22" fill="#17334c">El paciente es un registro clínico: no dispone de acceso al panel.</text>
<text x="979" y="1002" text-anchor="middle" font-size="21" fill="#64748b">CERPAX utiliza un enlace o QR temporal; no inicia sesión.</text>

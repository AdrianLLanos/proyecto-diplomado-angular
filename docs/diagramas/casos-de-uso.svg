<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100" role="img" aria-labelledby="title desc">
<title id="title">Casos de uso: gestión de pacientes y radiografías dentales</title>
<desc id="desc">Sistema exclusivamente web. Tres actores y nueve casos de uso, alineados con RF-01 a RF-08 del perfil y las recomendaciones de tutoría. Administrador: iniciar sesión, gestionar cuentas autorizadas y consultar trazabilidad. Odontólogo: iniciar sesión, registrar y consultar pacientes, crear solicitud de radiografía, generar enlace temporal o código QR, consultar radiografía y consultar estado de solicitud. CERPAX: cargar radiografía mediante acceso temporal. Todos los actores se encuentran fuera del límite del sistema.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.label{font-size:18px}.actor-name{font-size:18px;font-weight:700}.role{font-size:14px;fill:#526176}.actor{color:#235d9a}.actor circle{fill:white;stroke:currentColor;stroke-width:2.2}.actor path{fill:none;stroke:currentColor;stroke-width:2.2}.actor .actor-name{fill:currentColor}#odontologo{color:#08766c}#cerpax{color:#75519b}.association{stroke:#526176;stroke-width:1.5;fill:none}.association[data-from="administrador"]{stroke:#235d9a}.association[data-from="odontologo"]{stroke:#08766c}.association[data-from="cerpax"]{stroke:#75519b}.use-case ellipse{fill:#eff9f6;stroke:#08766c;stroke-width:1.7}#cuentas ellipse,#trazabilidad ellipse{fill:#edf4fc;stroke:#235d9a}#sesion ellipse{fill:#f1f4f8;stroke:#526176}#carga ellipse{fill:#f6f0fb;stroke:#75519b}</style>
<rect width="850" height="1100" fill="white"/>
<text class="heading" x="425" y="57" text-anchor="middle"><tspan x="425" dy="0">Diagrama de casos de uso</tspan></text>
<style>.heading{font-size:24px;font-weight:700}.system{font-size:18px;font-weight:700}.access-note{font-size:14px}</style>
<rect id="system-boundary" x="232" y="96" width="401" height="926" fill="white" stroke="#233e60" stroke-width="1.8"/>
<path d="M 233 97 H 632 V 154 H 233 Z" fill="#edf2f8"/>
<text class="system" x="432.5" y="119" text-anchor="middle"><tspan x="432.5" dy="0">Sistema web de gestión de pacientes</tspan><tspan x="432.5" dy="23">y radiografías dentales</tspan></text>
<g id="associations"><line class="association" data-from="administrador" data-to="cuentas" x1="718" y1="295" x2="605" y2="200"/><line class="association" data-from="administrador" data-to="trazabilidad" x1="718" y1="295" x2="605" y2="295"/><line class="association" data-from="administrador" data-to="sesion" x1="718" y1="295" x2="605" y2="390"/><line class="association" data-from="odontologo" data-to="sesion" x1="142" y1="597" x2="260" y2="390"/><line class="association" data-from="odontologo" data-to="pacientes" x1="142" y1="597" x2="260" y2="485"/><line class="association" data-from="odontologo" data-to="solicitud" x1="142" y1="597" x2="260" y2="580"/><line class="association" data-from="odontologo" data-to="acceso" x1="142" y1="597" x2="260" y2="675"/><line class="association" data-from="odontologo" data-to="consulta" x1="142" y1="597" x2="260" y2="770"/><line class="association" data-from="odontologo" data-to="estado" x1="142" y1="597" x2="260" y2="865"/><line class="association" data-from="cerpax" data-to="carga" x1="718" y1="960" x2="605" y2="960"/></g>
<g class="use-case" id="cuentas"><ellipse cx="432.5" cy="200" rx="172.5" ry="34"/><text class="label" x="432.5" y="194" text-anchor="middle"><tspan x="432.5" dy="0">Gestionar cuentas</tspan><tspan x="432.5" dy="23">autorizadas</tspan></text></g><g class="use-case" id="trazabilidad"><ellipse cx="432.5" cy="295" rx="172.5" ry="34"/><text class="label" x="432.5" y="301" text-anchor="middle"><tspan x="432.5" dy="0">Consultar trazabilidad</tspan></text></g><g class="use-case" id="sesion"><ellipse cx="432.5" cy="390" rx="172.5" ry="34"/><text class="label" x="432.5" y="396" text-anchor="middle"><tspan x="432.5" dy="0">Iniciar sesión</tspan></text></g><g class="use-case" id="pacientes"><ellipse cx="432.5" cy="485" rx="172.5" ry="34"/><text class="label" x="432.5" y="479" text-anchor="middle"><tspan x="432.5" dy="0">Registrar y consultar</tspan><tspan x="432.5" dy="23">pacientes</tspan></text></g><g class="use-case" id="solicitud"><ellipse cx="432.5" cy="580" rx="172.5" ry="34"/><text class="label" x="432.5" y="574" text-anchor="middle"><tspan x="432.5" dy="0">Crear solicitud</tspan><tspan x="432.5" dy="23">de radiografía</tspan></text></g><g class="use-case" id="acceso"><ellipse cx="432.5" cy="675" rx="172.5" ry="34"/><text class="label" x="432.5" y="669" text-anchor="middle"><tspan x="432.5" dy="0">Generar enlace temporal</tspan><tspan x="432.5" dy="23">o código QR</tspan></text></g><g class="use-case" id="consulta"><ellipse cx="432.5" cy="770" rx="172.5" ry="34"/><text class="label" x="432.5" y="776" text-anchor="middle"><tspan x="432.5" dy="0">Consultar radiografía</tspan></text></g><g class="use-case" id="estado"><ellipse cx="432.5" cy="865" rx="172.5" ry="34"/><text class="label" x="432.5" y="859" text-anchor="middle"><tspan x="432.5" dy="0">Consultar estado</tspan><tspan x="432.5" dy="23">de solicitud</tspan></text></g><g class="use-case" id="carga"><ellipse cx="432.5" cy="960" rx="172.5" ry="34"/><text class="label" x="432.5" y="954" text-anchor="middle"><tspan x="432.5" dy="0">Cargar radiografía</tspan><tspan x="432.5" dy="23">mediante acceso temporal</tspan></text></g>
<g id="administrador" class="actor"><circle cx="745" cy="261" r="14"/><path d="M 745 275 V 323 M 718 295 H 772 M 745 323 L 721 360 M 745 323 L 769 360"/><text class="actor-name" x="745" y="388" text-anchor="middle"><tspan x="745" dy="0">Administrador</tspan></text><text class="role" x="745" y="411" text-anchor="middle"><tspan x="745" dy="0">Actor interno</tspan></text></g>
<g id="odontologo" class="actor"><circle cx="115" cy="563" r="14"/><path d="M 115 577 V 625 M 88 597 H 142 M 115 625 L 91 662 M 115 625 L 139 662"/><text class="actor-name" x="115" y="690" text-anchor="middle"><tspan x="115" dy="0">Odontólogo</tspan></text><text class="role" x="115" y="713" text-anchor="middle"><tspan x="115" dy="0">Actor interno</tspan></text></g>
<g id="cerpax" class="actor"><circle cx="745" cy="926" r="14"/><path d="M 745 940 V 988 M 718 960 H 772 M 745 988 L 721 1025 M 745 988 L 769 1025"/><text class="actor-name" x="745" y="1053" text-anchor="middle"><tspan x="745" dy="0">CERPAX</tspan></text><text class="role" x="745" y="1076" text-anchor="middle"><tspan x="745" dy="0">Actor externo</tspan></text></g>
</svg>
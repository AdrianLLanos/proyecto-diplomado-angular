<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Diagrama general de casos de uso</title><desc id="desc">Administrador y Odontólogo acceden al panel. CERPAX carga radiografías mediante un enlace temporal. Nueve casos de uso muestran las responsabilidades principales.</desc>
<defs><marker id="arrow-admin" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#2563eb"/></marker><marker id="arrow-doctor" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#087f73"/></marker><marker id="arrow-external" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#7c3aed"/></marker><marker id="arrow-shared" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,sans-serif;text-anchor:middle;fill:#17334c}.actor{font-size:27px;font-weight:700}.small{font-size:19px;fill:#64748b}.case-name{font-size:22px}.case-id{font-size:15px;font-weight:700;letter-spacing:1px}.association{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}</style>
